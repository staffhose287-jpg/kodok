<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Izin Karyawan</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #030817;
    color: #fff;
}

.container {
    width: 96%;
    max-width: 1500px;
    margin: 25px auto;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 22px;
    font-weight: 800;
}

.date {
    background: #0b1428;
    border: 1px solid #263450;
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 12px;
    color: #8ea4c8;
}

/* INPUT PANEL */
.panel {
    background: #070f20;
    border: 1px solid #18243c;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.panel h3 {
    margin-top: 0;
    font-size: 14px;
    color: #9eb0ce;
}

.form {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr auto;
    gap: 10px;
}

input,
select {
    width: 100%;
    background: #030817;
    color: #fff;
    border: 1px solid #263450;
    padding: 12px;
    border-radius: 7px;
    outline: none;
}

button {
    border: 0;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn-start {
    background: #11b8e8;
    color: #00131d;
}

.btn-start:hover {
    opacity: .85;
}

/* SUMMARY */
.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: #070f20;
    border: 1px solid #18243c;
    border-radius: 10px;
    padding: 15px;
}

.card-title {
    font-size: 11px;
    color: #70819d;
    text-transform: uppercase;
}

.card-number {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

.toilet {
    color: #4bc7ff;
}

.bab {
    color: #d66cff;
}

.makan {
    color: #ffb52e;
}

.izin {
    color: #ff5e8a;
}

.total {
    color: #44e29a;
}

/* TABLE */
.table-wrapper {
    background: #070f20;
    border: 1px solid #18243c;
    border-radius: 10px;
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: #0b1428;
}

th {
    padding: 13px;
    text-align: left;
    font-size: 10px;
    color: #70819d;
    text-transform: uppercase;
}

td {
    padding: 13px;
    border-top: 1px solid #18243c;
    font-size: 12px;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
}

.badge-toilet {
    background: rgba(75,199,255,.15);
    color: #4bc7ff;
}

.badge-bab {
    background: rgba(214,108,255,.15);
    color: #d66cff;
}

.badge-makan {
    background: rgba(255,181,46,.15);
    color: #ffb52e;
}

.badge-izin {
    background: rgba(255,94,138,.15);
    color: #ff5e8a;
}

.active {
    color: #ffb52e;
    font-weight: bold;
}

.finished {
    color: #44e29a;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 8px;
    font-weight: bold;
    background: #743ee8;
}

.name {
    display: flex;
    align-items: center;
    font-weight: bold;
}

.btn-back {
    background: #44e29a;
    color: #001b10;
    padding: 7px 12px;
    font-size: 10px;
}

.btn-delete {
    background: #2a1620;
    color: #ff648d;
    padding: 7px 10px;
    font-size: 10px;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #60708a;
}

/* REKAP */
.rekap {
    margin-top: 20px;
}

.rekap-title {
    margin-bottom: 10px;
    font-weight: bold;
}

.search {
    margin-bottom: 12px;
}

@media(max-width: 900px) {

    .form {
        grid-template-columns: 1fr;
    }

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        min-width: 950px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">
            MONITORING IZIN KARYAWAN
        </div>

        <div class="date" id="tanggalHariIni">
            HARI INI
        </div>
    </div>


    <!-- INPUT -->
    <div class="panel">

        <h3>CATAT AKTIVITAS KARYAWAN</h3>

        <div class="form">

            <input
                type="text"
                id="nama"
                placeholder="Nama karyawan..."
            >

            <select id="aktivitas">

                <option value="Toilet">
                    🚻 Toilet
                </option>

                <option value="BAB">
                    🚽 BAB
                </option>

                <option value="Ambil Makan">
                    🍱 Ambil Makan
                </option>

                <option value="Izin">
                    📌 Izin
                </option>

            </select>

            <input
                type="text"
                id="divisi"
                placeholder="Divisi..."
                value="OPERASIONAL KD"
            >

            <button
                class="btn-start"
                onclick="mulaiIzin()"
            >
                MULAI IZIN
            </button>

        </div>

    </div>


    <!-- SUMMARY -->
    <div class="summary">

        <div class="card">
            <div class="card-title">
                Toilet
            </div>

            <div
                class="card-number toilet"
                id="totalToilet"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                BAB
            </div>

            <div
                class="card-number bab"
                id="totalBab"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Ambil Makan
            </div>

            <div
                class="card-number makan"
                id="totalMakan"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Izin
            </div>

            <div
                class="card-number izin"
                id="totalIzin"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Sedang Izin
            </div>

            <div
                class="card-number total"
                id="sedangIzin"
            >
                0
            </div>
        </div>

    </div>


    <!-- LOG AKTIVITAS -->
    <div class="panel">

        <h3>LOG AKTIVITAS HARI INI</h3>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="Cari nama karyawan..."
            onkeyup="tampilkanData()"
        >

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>STAFF</th>

                    <th>DIVISI</th>

                    <th>AKTIVITAS</th>

                    <th>MULAI</th>

                    <th>KEMBALI</th>

                    <th>DURASI</th>

                    <th>STATUS</th>

                    <th>ACTION</th>

                </tr>

            </thead>

            <tbody id="logTable">
            </tbody>

        </table>

    </div>


    <!-- REKAP -->
    <div class="panel rekap">

        <div class="rekap-title">
            📊 REKAP AKTIVITAS PER KARYAWAN
        </div>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>STAFF</th>
                        <th>TOILET</th>
                        <th>BAB</th>
                        <th>AMBIL MAKAN</th>
                        <th>IZIN</th>
                        <th>TOTAL KALI</th>
                        <th>TOTAL DURASI</th>

                    </tr>

                </thead>

                <tbody id="rekapTable">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================
   DATABASE LOCAL
========================= */

let data = JSON.parse(
    localStorage.getItem("monitoringIzin")
) || [];


/* =========================
   SIMPAN
========================= */

function simpan() {

    localStorage.setItem(
        "monitoringIzin",
        JSON.stringify(data)
    );

}


/* =========================
   FORMAT WAKTU
========================= */

function formatJam(date) {

    return date.toLocaleTimeString(
        "id-ID",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


/* =========================
   FORMAT DURASI
========================= */

function formatDurasi(ms) {

    let detik = Math.floor(ms / 1000);

    let jam = Math.floor(detik / 3600);

    detik %= 3600;

    let menit = Math.floor(detik / 60);

    detik %= 60;

    return (
        String(jam).padStart(2, "0")
        + ":" +
        String(menit).padStart(2, "0")
        + ":" +
        String(detik).padStart(2, "0")
    );

}


/* =========================
   MULAI IZIN
========================= */

function mulaiIzin() {

    let nama =
        document.getElementById("nama").value.trim();

    let aktivitas =
        document.getElementById("aktivitas").value;

    let divisi =
        document.getElementById("divisi").value.trim();


    if (!nama) {

        alert("Masukkan nama karyawan terlebih dahulu.");

        return;

    }


    /* CEK APAKAH MASIH IZIN */

    let masihIzin = data.find(
        x =>
            x.nama.toLowerCase() === nama.toLowerCase()
            &&
            x.status === "Sedang Izin"
    );


    if (masihIzin) {

        alert(
            nama +
            " masih tercatat sedang izin."
        );

        return;

    }


    let sekarang = new Date();


    data.push({

        id: Date.now(),

        nama: nama,

        divisi: divisi,

        aktivitas: aktivitas,

        mulai: sekarang.toISOString(),

        kembali: null,

        durasi: 0,

        status: "Sedang Izin"

    });


    simpan();

    tampilkanData();

    document.getElementById("nama").value = "";

}


/* =========================
   KEMBALI
========================= */

function kembali(id) {

    let item = data.find(
        x => x.id === id
    );


    if (!item) return;


    let sekarang = new Date();

    let mulai =
        new Date(item.mulai);


    item.kembali =
        sekarang.toISOString();


    item.durasi =
        sekarang - mulai;


    item.status =
        "Selesai";


    simpan();

    tampilkanData();

}


/* =========================
   HAPUS
========================= */

function hapus(id) {

    if (
        !confirm(
            "Hapus data ini?"
        )
    ) return;


    data =
        data.filter(
            x => x.id !== id
        );


    simpan();

    tampilkanData();

}


/* =========================
   WARNA AKTIVITAS
========================= */

function badgeAktivitas(aktivitas) {

    let cls = "badge-izin";

    if (aktivitas === "Toilet")
        cls = "badge-toilet";

    if (aktivitas === "BAB")
        cls = "badge-bab";

    if (aktivitas === "Ambil Makan")
        cls = "badge-makan";


    return `
        <span class="badge ${cls}">
            ${aktivitas}
        </span>
    `;

}


/* =========================
   TAMPIL DATA
========================= */

function tampilkanData() {

    let table =
        document.getElementById("logTable");

    let search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    table.innerHTML = "";


    let filtered =
        data.filter(
            x =>
                x.nama
                .toLowerCase()
                .includes(search)
        );


    filtered.reverse().forEach(
        item => {

            let mulai =
                new Date(item.mulai);

            let kembaliText =
                item.kembali
                ?
                formatJam(
                    new Date(item.kembali)
                )
                :
                "—";


            let durasi =
                item.kembali
                ?
                formatDurasi(
                    item.durasi
                )
                :
                formatDurasi(
                    Date.now() - mulai
                );


            let status =
                item.status === "Sedang Izin"
                ?
                `<span class="active">
                    ● SEDANG IZIN
                </span>`
                :
                `<span class="finished">
                    ✓ SELESAI
                </span>`;


            let button =
                item.status === "Sedang Izin"
                ?
                `
                <button
                    class="btn-back"
                    onclick="kembali(${item.id})"
                >
                    KEMBALI
                </button>
                `
                :
                "";


            table.innerHTML += `

                <tr>

                    <td>

                        <div class="name">

                            <span class="avatar">
                                ${item.nama
                                .charAt(0)
                                .toUpperCase()}
                            </span>

                            ${item.nama}

                        </div>

                    </td>


                    <td>
                        ${item.divisi}
                    </td>


                    <td>
                        ${badgeAktivitas(
                            item.aktivitas
                        )}
                    </td>


                    <td>
                        ${formatJam(mulai)}
                    </td>


                    <td>
                        ${kembaliText}
                    </td>


                    <td>
                        <strong>
                            ${durasi}
                        </strong>
                    </td>


                    <td>
                        ${status}
                    </td>


                    <td>

                        ${button}

                        <button
                            class="btn-delete"
                            onclick="hapus(${item.id})"
                        >
                            HAPUS
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    if (filtered.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    Belum ada aktivitas hari ini
                </td>

            </tr>

        `;

    }


    updateSummary();

    updateRekap();

}


/* =========================
   SUMMARY
========================= */

function updateSummary() {

    document.getElementById("totalToilet").innerText =
        data.filter(
            x => x.aktivitas === "Toilet"
        ).length;


    document.getElementById("totalBab").innerText =
        data.filter(
            x => x.aktivitas === "BAB"
        ).length;


    document.getElementById("totalMakan").innerText =
        data.filter(
            x => x.aktivitas === "Ambil Makan"
        ).length;


    document.getElementById("totalIzin").innerText =
        data.filter(
            x => x.aktivitas === "Izin"
        ).length;


    document.getElementById("sedangIzin").innerText =
        data.filter(
            x => x.status === "Sedang Izin"
        ).length;

}


/* =========================
   REKAP KARYAWAN
========================= */

function updateRekap() {

    let table =
        document.getElementById("rekapTable");

    table.innerHTML = "";


    let staff = {};


    data.forEach(item => {

        if (!staff[item.nama]) {

            staff[item.nama] = {

                toilet: 0,

                bab: 0,

                makan: 0,

                izin: 0,

                durasi: 0

            };

        }


        if (
            item.aktivitas === "Toilet"
        )
            staff[item.nama].toilet++;


        if (
            item.aktivitas === "BAB"
        )
            staff[item.nama].bab++;


        if (
            item.aktivitas === "Ambil Makan"
        )
            staff[item.nama].makan++;


        if (
            item.aktivitas === "Izin"
        )
            staff[item.nama].izin++;


        if (item.kembali) {

            staff[item.nama].durasi +=
                item.durasi;

        }

    });


    Object.keys(staff).forEach(
        nama => {

            let s = staff[nama];


            let total =
                s.toilet +
                s.bab +
                s.makan +
                s.izin;


            table.innerHTML += `

                <tr>

                    <td>
                        <strong>
                            ${nama}
                        </strong>
                    </td>

                    <td class="toilet">
                        ${s.toilet}
                    </td>

                    <td class="bab">
                        ${s.bab}
                    </td>

                    <td class="makan">
                        ${s.makan}
                    </td>

                    <td class="izin">
                        ${s.izin}
                    </td>

                    <td>
                        <strong>
                            ${total}
                        </strong>
                    </td>

                    <td>
                        <strong>
                            ${formatDurasi(
                                s.durasi
                            )}
                        </strong>
                    </td>

                </tr>

            `;

        }
    );

}


/* =========================
   TANGGAL
========================= */

function tanggal() {

    let sekarang = new Date();

    document.getElementById(
        "tanggalHariIni"
    ).innerText =
        sekarang.toLocaleDateString(
            "id-ID",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

}


/* =========================
   UPDATE TIMER
========================= */

setInterval(
    tampilkanData,
    1000
);


tanggal();

tampilkanData();

</script>

</body>
</html>
